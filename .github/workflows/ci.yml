name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-sbom:
    name: Run Tests and Generate SBOM
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip check

      - name: Run pytest
        run: pytest

      - name: Generate CycloneDX SBOM
        run: |
          APP_PYTHON="$(command -v python)"
          python -m venv "$RUNNER_TEMP/sbom-tool"
          "$RUNNER_TEMP/sbom-tool/bin/python" -m pip install cyclonedx-bom==7.5.0
          "$RUNNER_TEMP/sbom-tool/bin/cyclonedx-py" environment "$APP_PYTHON" --spec-version 1.6 --output-format JSON --validate -o sbom/sbom.cdx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: sbom-cdx-json
          path: sbom/sbom.cdx.json
          if-no-files-found: error
